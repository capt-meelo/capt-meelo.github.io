title: Capt. Meelo
description: This blog contains write-ups of the things that I researched, learned, and wanted to share to others.
author: Capt. Meelo
handle: captmeelo
tagline: hack · learn · share
github: https://github.com/capt-meelo
about: An infosec guy who's constantly seeking for knowledge.
avatar_url: /static/img/avatar.jpg

collections:
  project:
    output: true
    permalink: /project/:path/

social:
    - name: github
      link: "https://github.com/capt-meelo"
    - name: twitter
      link: "https://twitter.com/CaptMeelo"

twitter:
  username: CaptMeelo         # used by jekyll-seo-tag for the twitter card

# Category label colours live in _sass/main.scss (.cat-<name>).
categories_order:
  - maldev
  - redteam
  - exploitdev
  - pentest
  - mobile
  - research
  - talks

url: "https://captmeelo.com"
baseurl: ""

markdown: kramdown
kramdown:
  # No `input: GFM` on purpose — the GFM parser hard-wraps single newlines,
  # which would change how all 30 existing posts render.
  auto_ids: true              # the TOC and heading anchors depend on these
  syntax_highlighter: rouge

# Must stay as-is: this is the stock Jekyll `date` permalink and every
# published write-up URL depends on it. Do not change.
permalink: /:categories/:year/:month/:day/:title.html

excerpt_separator: "<!--more-->"

sass:
  style: compressed

plugins:
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jemoji

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  # NOT `endings: all`. That strips </p>, which leaves a <p> open inside the
  # post card's <a>. The HTML parser then runs the adoption agency algorithm,
  # reparenting the excerpt out of the card link and wrapping it in a cloned
  # <a> — the excerpt turns blue and picks up 1.1rem of padding above it.
  # Every other element in the default list is safe to strip.
  endings: [li, dt, dd, rt, rp, optgroup, option, colgroup, caption, thead, tbody, tfoot, tr, td, th]
  ignore:
    envs: [development]
