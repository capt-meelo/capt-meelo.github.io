<header class="site-head">
  <a class="brand" href="/">
    <span class="avatar" aria-hidden="true">
      {{ site.handle | slice: 0, 1 | upcase }}
      <img class="avatar-img" src="{{ site.avatar_url }}" alt=""
           onerror="this.remove()">
    </span>
    <span class="brand-text">
      <span class="prompt"><span class="sigil">~$</span>{{ site.handle }}</span>
      <span class="tagline">{{ site.tagline }}</span>
    </span>
  </a>

  <button class="theme-btn" id="theme-btn" type="button"
          aria-label="Switch theme" title="Switch theme">
    <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"
            fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
</header>
